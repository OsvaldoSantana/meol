# Dependabot (25/09/2026). Semanal, os dois ecossistemas.
#
# github-actions: as acoes sao fixadas por SHA com a tag em comentario
# (auditoria/test_workflows.py exige o SHA). O Dependabot atualiza o SHA e o comentario juntos,
# e o trabalho manual de `git ls-remote` deixa de existir.
#
# pip: os pinos exatos do pyproject.toml. As dependencias NUMERICAS (pyproject.toml ->
# tool.meol.dependencias.numericas) ficam de fora -- P-148, decisao dele, 25/09/2026. Um PR
# que as suba muda a impressao do ambiente, e o numero pre-registrado passaria a ser numero
# novo (P-15): o `test_alocacao.py` o reprova de proposito. Na primeira segunda-feira vieram
# dois PRs assim; deixar o vermelho semanal como aviso e o alarme que dispara sempre (A-08).
# O `ignore` e derivado da lista do pyproject: `auditoria/test_workflows.py` reprova se os
# dois divergirem, nos dois sentidos.
# SAI quando o pre-registro ML for executado e os resultados reconferidos na versao nova, ou
# quando houver aviso de seguranca -- que continua chegando pelos Dependabot alerts, que nao
# dependem deste arquivo.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "CI"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "Dependencias"
    ignore:
      - dependency-name: "numpy"
      - dependency-name: "pandas"
      # 16/10/2026 (P-170): o instrumento da R3 (pyproject -> instrumento_r3). O PR #69 trocou o
      # Playwright no meio da rodada. SAI quando a R3 fechar.
      - dependency-name: "playwright"
