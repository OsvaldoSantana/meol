# O degrau 4a do Wayback da R3 (CLAUDE.md 5-B.18): o Save Page Now no servidor do GitHub -- 16/10/2026.
#
# O PROBLEMA. As 86 classificadas da R3 tinham `arquivo_wayback = PENDENTE_LOCAL`, e o rodape do
# veto.md mandava arquivar "na maquina dele". A regra do degrau 4 manda tentar primeiro o executor
# que nao depende dele: este workflow (4a), depois o runner br-sp (4b), so entao a sessao local (4c).
#
# O FLUXO. Um push numa branch `arquivar-r3/<nome>` roda `tools/r3_arquivar.py --saida`, que pede
# ao Save Page Now anonimo cada pagina PENDENTE_LOCAL, uma a cada 12 s, e escreve o resultado num
# JSON. O JSON sobe como artefato; a sessao o baixa (`gh run download`) e grava o CSV pelo
# `--aplicar`, com o degrau e o proximo executor nas paginas que recusarem.
#
# O QUE NAO FAZ. Nao usa segredo nem conta do archive.org (5-A.7) e so le o repositorio
# (`contents: read`): nao commita. O artefato tem so URLs publicas e links do Wayback.

name: Arquivar R3

on:
  push:
    branches: ['arquivar-r3/**']

concurrency:
  group: arquivar-r3-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  arquivar:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      # Mesmos SHAs dos outros workflows (checkout v7.0.1, setup-python v7.0.0, upload v7.0.1).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Instalar
        run: python -m pip install .
      - name: De onde sai o pedido
        run: curl -s https://ipinfo.io/json | python -c "import json,sys; d=json.load(sys.stdin); print(d.get('city'), d.get('country'), d.get('org'))" || true
      - name: Arquivar
        run: python tools/r3_arquivar.py --saida arquivamento.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: arquivamento-r3
          path: arquivamento.json
          retention-days: 7
