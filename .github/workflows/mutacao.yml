# Mutacao: UMA medicao, manual (25/09/2026). Nao entra no push, pelo custo.
#
# Linux porque o mutmut nao roda em Windows -- medido na maquina dele em 25/09: "To run
# mutmut on Windows, please use the WSL", e ela nao tem WSL. Alvos e opcoes em
# pyproject.toml -> [tool.mutmut]: ajustar.py, estado_io.py, os portoes (alocacao.py) e
# insumo_ml.py.
#
# O resultado sai como artefato (a lista de sobreviventes). Cada mutante sobrevivente e um
# ACHADO CANDIDATO: uma mudanca no codigo que nenhum teste percebeu. Candidato, porque um
# mutante equivalente (que nao muda comportamento) tambem sobrevive -- quem promove a
# achado e a leitura (regua 5-B, pergunta 3).

name: Mutacao

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Instalar
        run: python -m pip install ".[dev,mutacao]"
      # A contagem sai como anotacao (::notice), que a API publica le sem login; o log do
      # job nao. Nenhuma alteracao testada = job VERMELHO: a primeira execucao ficou verde
      # em 46 s sem dizer se testou algo (F-02). Contagem pelos `mutants/*.meta`, com a
      # tabela de status do proprio mutmut (auditoria/mutmut_contagem.py).
      - name: Rodar o mutmut
        run: |
          set +e
          python -m mutmut run > mutmut-run.txt 2>&1
          rc=$?
          cat mutmut-run.txt
          python -m mutmut results > mutmut-resultados.txt 2>&1
          cat mutmut-resultados.txt
          python auditoria/mutmut_contagem.py --saida-mutmut "$rc"
          conta=$?
          if [ "$conta" -ne 0 ]; then
            tail -n 15 mutmut-run.txt | tr -d '\r' | sed 's/%/%25/g; s/^/::error title=mutmut run::/'
          fi
          exit $conta
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: mutmut-resultados
          path: |
            mutmut-resultados.txt
            mutmut-run.txt
