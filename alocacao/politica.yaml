    "1.18.0": >
      ACHADO U-01, e ele e uma correcao do usuario sobre o ROTEIRO, nao sobre o codigo.
      Eu vinha listando "aporte realizado zero" e "teses nao assinadas" como bloqueios
      de DESENVOLVIMENTO. Ele apontou que, se isto fosse um produto vendido, um cliente
      novo teria exatamente isso — zero de tudo — e o sistema teria de responder mesmo
      assim. Esta certo, e o motor JA se comporta assim: patrimonio zero e nada
      assinado recebem resposta completa e acionavel. O defeito era do plano.
      E a L-01 num nivel acima: a L-01 separou politica.yaml (motor) de perfil.yaml
      (usuario) na CONFIGURACAO, e o PLANO nunca recebeu essa separacao.
      Tres consequencias. (1) test_usuario_novo.py: 13 testes que medem a PRIMEIRA
      EXPERIENCIA como comportamento do sistema, nenhum deles lendo o estado.yaml de
      uma pessoa — ha uma guarda estrutural que recusa `estado_io.carregar()` naquele
      arquivo, e ela pegou o proprio autor. (2) estado.exemplo.yaml: o cadastro minimo,
      que torna visivel a fronteira entre os QUATRO fatos de vida que o sistema
      legitimamente pergunta e o PATRIMONIO, que comeca vazio em todo cliente novo.
      (3) toda pendencia passa a declarar CLASSE — BLOQUEIA_O_SISTEMA (22),
      DECISAO_DE_DESENHO (5) ou DADO_DE_UM_USUARIO (2). So duas de 29 eram dado do
      usuario, e eu tinha as duas no caminho critico. 282 testes.
    "1.17.0": >
      P-40 fechada: ruff e mypy configurados, em ZERO, e ligados a suite. Zero e nao
      "poucos" — barreira com baseline conhecida nao e barreira, a violacao seguinte se
      esconde no ruido. Toda dispensa de regra tem MOTIVO ESCRITO no pyproject, e um
      teste conta as linhas de justificativa para que nao se possa acrescentar um
      codigo de regra em silencio. E701/E702 sao convencao da casa (228 ocorrencias,
      nenhuma descuido); E501 ficou LIGADO ao contrario, porque linha longa aqui era
      sintoma de assinatura que cresceu — seis delas eu criei na P-37 e viraram a
      tabela BLOCOS_A_ESPALHAR. As ferramentas ficam no grupo `lint`, FORA da impressao
      do ambiente: nao mudam numero, e exigi-las instaladas deixaria vermelha a maquina
      de quem so quer rodar o motor; os testes PULAM com o comando que as liga.
      O que o lint achou de real: 25 imports mortos, 5 f-strings vazias, 2 nomes
      ambiguos, 1 `None * float` que o mypy provou improvavel de descartar (nao era bug
      em execucao — era tipo nao provavel, e o codigo ficou melhor), e o ACHADO T-01.
      ACHADO T-01: `motor.montar_rotas` e um TERCEIRO CATALOGO, paralelo ao
      catalogo.yaml — 22 rotas contra 25, com 13 nomes que so existem la. A P-36 disse
      "os dois catalogos" e havia tres. Nenhum modulo de producao o chama; so o
      test_motor.py. Nao foi apagado (P-43): apagar codigo com teste proprio sem medir
      o que os testes guardam e como se perde uma rede. Uma linha morta dentro dele foi
      removida: a atribuicao era copia, e a CHAMADA contradizia a docstring da funcao —
      ela abortaria num lugar que promete capturar o bloqueio como marcador. 269 testes.
    "1.16.0": >
      Sessao de performance, escalabilidade e rastreabilidade.
      ACHADO S-01: `hash_custos()` era chamada 73 vezes por `alocar()` — uma por
      consulta ao cache de arrasto, que a usava na chave — e RELIA e RE-HASHEAVA os
      33 KB do custos.yaml a cada vez. 37% do tempo do motor era gasto hasheando um
      arquivo para decidir se podia usar um valor ja calculado. Memoizado por
      (caminho, mtime_ns, tamanho).
      ACHADO S-02, e este e da familia do F-02 e do N-01: o cache global de
      `arrasto_anualizado` tinha na chave o hash do ARQUIVO, mas o custo vem do `C`
      que chega como PARAMETRO. Passar um `C` alterado em memoria — o que TODO teste
      faz — devolvia o valor do `C` original, em silencio. Qualquer teste que
      alterasse um custo e conferisse arrasto ou dominancia estava testando nada.
      Nasceu a distincao que faltava: `hash_custos()` e do ARQUIVO e serve a
      PROCEDENCIA; `impressao_de_custos()` e do CONTEUDO e serve a CORRECAO DE CACHE.
      Resultado: alocar() de 9,79 ms para 2,75 ms E correto, que antes nao era.
      P-38 fechada: conftest.py com fixtures `custos`/`politica` e uma guarda que
      acusa o teste que suja estado compartilhado, nomeia o objeto e restaura para que
      so o culpado fique vermelho. A escolha foi DETECTAR e nao copiar sempre —
      esconder defeito atras de copia e o padrao que este projeto rejeita.
      P-39 nova e fechada: impacto.py, o mapa de quem alcanca o que. Ele existe porque
      a resposta honesta a "como voce rastreia o alcance de uma alteracao" era: suite,
      grep e instantaneo dourado — nenhum deles um MAPA. Reporta os PONTOS CEGOS junto,
      porque mapa que finge completude e pior que grep. 265 testes.
    "1.15.0": >
      P-37 fechada: `alocar()` tinha 300 linhas e virou seis passos de 16 a 51. A
      quebra segue as fases que ja existiam no YAML, nao um criterio novo. GARANTIA:
      38 cenarios de estado foram serializados campo a campo antes — pesos, cada
      string de alerta, cada pendencia, cada rota em cada lista de rejeicao — e
      comparados depois; a UNICA diferenca em toda a matriz e o proprio
      `politica_hash`, que mudou porque este arquivo mudou. Zero desvio de
      comportamento.
      ACHADO R-01, e ele so foi encontravel DEPOIS da quebra, porque so entao deu
      para chamar `fase_universo` sozinha com uma politica alterada: a P-07 declarou
      a ordem dos portoes como dado e afirmou que troca-la e um commit no YAML. Isso
      e falso para 102 das 120 ordens — so 18 rodam. Os portoes mudam a FORMA do que
      trafega (o G3 transforma rota em par (rota, custo); G4, G7 e G8 consomem pares),
      e qualquer um deles antes do G3 estourava com TypeError no fundo de uma funcao
      de portao. Declarar a ordem como dado sem declarar o CONTRATO e declarar uma
      liberdade que nao existe — mesma familia do F-05 e do N-01. Cada portao da fase
      universo passou a declarar `consome`/`produz`, e `conferir_ordem_do_universo`
      recusa a ordem invalida ANTES de rodar: das 102 que nao rodam, 90 agora dizem
      por que, e as outras 12 ja diziam (e o guarda do F-02 disparando, nao defeito).
      A cadeia de `elif` da fase universo virou a tabela PORTOES_DO_UNIVERSO — a lista
      de portoes implementados existia so escondida naqueles ramos, e duas validacoes
      precisavam dela. 249 testes.
    "1.14.0": >
