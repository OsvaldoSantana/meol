      e um teste prova isso —, senao seria o N-01 em escala de catalogo. Toda rota e
      todo grupo de campos declaram procedencia.
      ACHADO Q-01: o tratamento de insumo bloqueado era inconsistente. Rotas de ETF
      degradavam com o motivo escrito; todas as outras derrubavam o CATALOGO INTEIRO —
      uma constante NAO_CONFIRMADO em corretagem.safra_terra apagaria as 25 rotas,
      inclusive as 24 que nao dependem dela, que e o oposto da doutrina P6. Regra
      unica agora: insumo bloqueado bloqueia A ROTA.
      ACHADO Q-02: `confirmacao` era uma letra por instituicao e o motor a aplica como
      multiplicador de TUDO, mas ela sempre significou "os CUSTOS podem ser lidos em
      fonte oficial" — a propria regra em corretora.multiplicador_de_confirmacao diz
      isso. BTG e Bradesco tem N e balanco vindo do Banco Central. O comportamento
      estava certo; o registro e que achatava tudo numa letra. Procedencia passou a
      ser por GRUPO DE CAMPOS e `confirmacao` virou DERIVADA. 239 testes.
    "1.13.0": >
      P-15 fechada, e ela era maior que o rotulo. O pre-registro promete que um
      resultado de backtest e reproduzivel; o .gitattributes e o sha256 selavam o DADO
      e o AMBIENTE nao estava selado — as versoes de numpy e pandas que produziram os
