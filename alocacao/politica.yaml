      excecao em vez de ser ignorado em silencio, e `exibe: true` finalmente exibe.
      P-28: o test_cobertura_yaml varria 6 das 19 secoes lendo 3 dos 11 modulos. Agora
      varre tudo, exige regime declarado por secao (OPERACIONAL / REGISTRO /
