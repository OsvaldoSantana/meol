      entra SEM a funcao LIQUIDEZ pelo achado J-01) e picpay_turbinado (bloqueado: a
      isencao depende de missoes que mudam todo mes). 216 testes.
    "1.11.0": >
      Achado N-01: a secao `corretora` declarava tres regras de pontuacao que so o
      Python decidia — multiplicador de confirmacao, escala de reclamacoes e escala de
      corretagem (esta ultima nem existia no YAML, era o literal 0.01 num comentario).
      Os numeros CONCORDAVAM, que e pior que discordar: editar o arquivo nao mudava
