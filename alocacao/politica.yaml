      "Historico desde 2010" (docs/fontes/cvm-dfp-politica-atualizacao.md) e "Historico
      desde 2011" (docs/fontes/cvm-itr-politica-atualizacao.md). Estava escrito no
      repositorio desde 06/09; o pre-registro v2 nao cruzou com a regra de DT_RECEB.
      Documento anterior nao esta em dados abertos. E FISICA enquanto a CVM nao publicar anos anteriores; buscar o
      ITR de 2010 no ENET documento a documento seria outra fonte, com outra procedencia.
    fonte: "ACHADOS.md CV-04; indice da CVM lido pela captura de 24/09/2026 (tools/baixar_cvm.py)"

  dt_captura_nao_e_data_de_conhecimento_do_mercado:
    tipo: NAO_CONSERTADA
    o_que_falta: >
      O leitor as-of de DFP/ITR (fase0/leitor_cvm.py) responde o que ESTE SISTEMA tinha
      capturado ate D, pela dt_captura do registro (docs/acervo/cvm/capturas.csv). Nao e a
      data em que o mercado soube: o documento chega a CVM pelo ENET (DT_RECEB), a CVM
      regera os ZIPs de dados abertos uma vez por semana (regeracoes observadas em
      domingos, CV-01 e CV-02) e o cron captura no mesmo dia ou no seguinte. Duas
      consequencias: (1) dentro da era da captura o leitor sabe DEPOIS do mercado, ate
      cerca de 8 dias pela cadencia observada (inferido da cadencia, nao medido documento
      a documento); (2) antes da primeira linha do registro, 24/09/2026, o leitor nao
      responde nada -- e o backtest de 2010 a 2026 esta inteiro antes dela.
    direcao_do_vies: >
      (1) Nunca a favor de vazamento: o leitor nao sabe antes do mercado. Penaliza a
      estrategia que reage a divulgacao, porque o sinal chega ate uma semana depois e o
      backtest a mede pior do que ela seria. (2) Antes de 24/09/2026 nao e vies, e
      ausencia: o leitor recusa (SemCaptura) em vez de usar a versao de hoje para o
      passado, que seria look-ahead.
    o_que_resolveria: >
      Uma segunda data de conhecimento, tirada da propria fonte. O indice de cada ZIP
      ({recurso}_cia_aberta_{ano}.csv) lista TODAS as versoes de cada documento com o
      DT_RECEB de cada uma (medido em 10/10/2026 no ITR 2024: 2.448 linhas, 2.161
      documentos, 238 com mais de uma versao, ate a VERSAO 6), enquanto o demonstrativo
      traz so a ultima (0 de 1.408 documentos da DRE consolidada com mais de uma VERSAO).
      "DT_RECEB da VERSAO presente <= D" reconstroi sem look-ahead, mas esconde o
      documento ate a data da ultima reapresentacao; quanto ele esconde e a medicao da
      pendencia. E, para o valor de versoes ja substituidas, copia de terceiro: a Wayback
      Machine tem o dfp_cia_aberta_2022.zip de 26/03/2026 (status 200); dfp 2015, 2020,
      2023 e itr 2021, 2023 nao tem copia nenhuma (archive.org/wayback/available,
      10/10/2026; o CDX, que listaria todas, nao respondeu da nuvem).
    pendencia: P-183
    quando_deixa_de_importar: >
      (1) Para decisao tomada dias depois da divulgacao (o aporte mensal), o atraso de ate
      uma semana nao muda o que se sabe. (2) Para o backtest anterior a 24/09/2026, nunca:
      ali a pergunta precisa da segunda data.
    por_que_nao_e_fisica: >
      O mundo fornece a data de conhecimento (DT_RECEB por versao, no proprio ZIP) e, em
      parte, as versoes antigas (Wayback). Fisico e so o residuo: o valor de versao
      substituida que ninguem guardou (CV-01).
    fonte: "docs/decisoes/2026-10-10-leitor-asof-cvm.md; docs/fontes/pesquisa-bases-e-apis-2026-09.md secao 3, armadilha 1"
