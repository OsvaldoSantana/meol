# Quem pode morar na raiz do repositorio -- decisao dele, 24/09/2026.
#
# A raiz tinha 25 arquivos rastreados, e 18 eram bilhete de entrega ja executado ou laudo
# de referencia. Um bilhete vencido na raiz tem a mesma cara de um vigente: o SEGUNDA-21.md
# precisou de um aviso "ROTEIRO VENCIDO" na primeira linha para nao ser seguido de novo.
#
# A regra: o prompt vive no chat; o registro vive em CLAUDE.md, PENDENCIAS.md e PLANO.md.
# Bilhete de entrega nao vai para a raiz. O que ja existe vai para `destinos`.
#
# Guarda: auditoria/test_raiz_viva.py -- arquivo rastreado na raiz fora desta lista
# reprova, e `.md` novo no disco da raiz tambem (antes do `git add`).
vivos:
  CLAUDE.md: "instrucao, doutrina e historia -- lido em toda sessao"
  PLANO.md: "onde queremos chegar e a ordem do que falta"
  PENDENCIAS.md: "as pendencias ativas, ate 20 (o resto aberto em docs/pendencias-reserva.md)"
  ACHADOS.md: "historia dos achados, sob demanda"
  README.md: "porta de entrada para quem chega de fora -- decisao dele, 25/09/2026"
  LICENSE: "Apache-2.0, o codigo -- decisao dele, 25/09/2026"
  LICENSE-DOCS: "CC BY 4.0, a prosa -- decisao dele, 25/09/2026"
  NOTICE: "o que cada licenca cobre, e o que e de terceiros"
  pyproject.toml: "versoes pinadas (P-15) e configuracao de lint e teste"
  .gitignore: "o que nunca entra no indice"
  .gitattributes: "fim de linha: o hash do dado nao muda com o CRLF"
  # 25/09/2026, decisao dele (Sessao B): os arquivos que o GitHub procura na raiz.
  CONTRIBUTING.md: "instalacao, testes, regras da casa e convencao de commit, para quem chega"
  SECURITY.md: "relato privado; dado pessoal vazado conta como vulnerabilidade"
  CODE_OF_CONDUCT.md: "Contributor Covenant 2.1, traducao oficial pt-BR"
  CITATION.cff: "como citar o projeto, e o NEFIN que ele usa"
destinos:
  bilhete: docs/historico/entregas/
  referencia: docs/referencia/
